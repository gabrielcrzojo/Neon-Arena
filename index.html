<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Arena</title>
  <link rel="icon" type="image/png" href="na.png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

</head>
<body>
  <main class="container">
    <header class="hero">
      <h1 class="title">Par ou Ímpar</h1>
      <p class="subtitle">Neon Arena</p>
    </header>

    <!-- Tela Inicial de Cadastro -->
    <section class="card screen" id="screen-cadastro">
      <span class="eyebrow cyan">Cadastro</span>
      <h2>Bem-vindo</h2>
      <p class="muted">Digite seu nome para entrar na arena.</p>
      <form id="form-cadastro" class="form">
        <input id="nome" type="text" placeholder="..." autofocus required />
        <button type="submit" class="btn btn-primary glow-purple">Entrar na arena</button>
      </form>
    </section>

    <!-- Placar do Jogador -->
    <section class="scoreboard card hidden" id="scoreboard">
      <div>
        <span class="eyebrow">Jogador</span>
        <p class="player-name" id="display-nome">---</p>
      </div>
      <div class="stats">
        <div class="stat"><span class="eyebrow">Vitórias</span><p class="purple" id="stat-wins">0</p></div>
        <div class="stat"><span class="eyebrow">Derrotas</span><p class="cyan" id="stat-losses">0</p></div>
        <div class="stat"><span class="eyebrow">Total</span><p id="stat-total">0</p></div>
      </div>
      <button type="button" id="btn-sair" class="btn btn-ghost">Sair</button>
    </section>

    <!-- Área de Jogo -->
    <section class="card screen hidden" id="screen-game">
      <form id="play-form" class="form">
        <span class="eyebrow">Sua escolha</span>
        <div class="choice-grid">
          <button type="button" class="choice active purple" data-choice="par">PAR</button>
          <button type="button" class="choice cyan" data-choice="impar">ÍMPAR</button>
        </div>

        <label for="numero" class="eyebrow mt">Seu número (0 — 10)</label>
        <input id="numero" type="number" min="0" max="10" placeholder="0" required />

        <button type="submit" class="btn btn-gradient">Jogar</button>
      </form>
    </section>

    <!-- Tela de Resultado -->
    <section class="card result hidden" id="screen-result">
      <h2 id="result-title"></h2>
      <div class="number-grid">
        <div class="tile"><span class="eyebrow">Você</span><p class="purple" id="num-player"></p></div>
        <div class="tile"><span class="eyebrow">Máquina</span><p class="cyan" id="num-comp"></p></div>
        <div class="tile"><span class="eyebrow">Soma</span><p id="num-sum"></p></div>
      </div>
      <p class="muted" id="result-detail"></p>
      <button type="button" class="btn btn-primary glow-purple" id="btn-again">Jogar novamente</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
